services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: shop, POSTGRES_DB: shopmind }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    env_file: ./backend/.env
    environment: { DATABASE_URL: "postgres://postgres:shop@db:5432/shopmind" }
    ports: ["4000:4000"]
    depends_on: [db]
volumes: { pgdata: {} }
